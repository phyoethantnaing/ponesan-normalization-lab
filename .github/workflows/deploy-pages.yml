name: Test, build, and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test normalization rules
        run: npm test
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Build website
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}/
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Explain hosting setup
        if: steps.pages.outcome != 'success'
        run: |
          echo '## Website build is ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tests and the production build passed. Publishing will start after GitHub Pages is enabled.' >> "$GITHUB_STEP_SUMMARY"
          echo 'In Settings → Pages, choose GitHub Actions. Then run this workflow again from the Actions tab.' >> "$GITHUB_STEP_SUMMARY"
          echo 'https://github.com/${{ github.repository }}/settings/pages' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish website
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
